[project]
name = "trainlocks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "rapidocr>=3.0",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.5",
]

# rapidocr hard-depends on opencv-python, whose wheels link libGL (GUI libs
# the slim runtime image does not ship). opencv-python-headless provides the
# identical cv2 module without the GUI deps; the Dockerfile removes the GUI
# build's leftover files so only headless lands in the runtime image.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pinned deliberately: ruff's default rule set changes between versions.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # `l` is load — strength-training domain convention (app/ocr.py)
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the app-module imports pick up DATABASE_URL
"app/main.py" = ["E402"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
