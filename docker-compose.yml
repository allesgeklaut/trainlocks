services:
  training-log:
    build: .
    container_name: training-log
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8000"
    security_opt:
      - no-new-privileges:true
    # Bind mount so the database file is visible in the repository.
    volumes:
      - ./training_log_data:/data
    env_file:
      - /opt/secrets/trainlocks.env
    environment:
      - DATABASE_URL=sqlite:////data/training_log.db
      # LLM settings come from /opt/secrets/trainlocks.env (env_file above):
      # LLM_BACKENDS, LLM_STATE_FILE, LLM_REASONING_EFFORT, LITELLM_API_KEY.
      - LLM_STATE_FILE=/data/llm_state.json
    networks:
      - default
      - stacks-shared
networks:
  default:
  stacks-shared:
    external: true

