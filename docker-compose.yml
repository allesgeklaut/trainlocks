services:
  training-log:
    build: .
    container_name: training-log
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8000"
    security_opt:
      - no-new-privileges:true
    # Bind mount so the database file is visible in the repository.
    volumes:
      - ./training_log_data:/data
    env_file:
      - /opt/secrets/trainlocks.env
    environment:
      - DATABASE_URL=sqlite:////data/training_log.db
      # Multi-backend LLM config, e.g.:
      # LLM_BACKENDS=[{"name":"ollama","type":"ollama","url":"http://host.docker.internal:11434","model":"llava:13b"}]
      - LLM_BACKENDS=${LLM_BACKENDS:-}
      - LLM_STATE_FILE=/data/llm_state.json
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
    networks:
      - default
      - stacks-shared
networks:
  default:
  stacks-shared:
    external: true

