<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="mask-icon" href="/static/favicon.svg" color="#cd7f32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="trainlocks" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=jetbrains-mono@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="mask-icon" href="/static/favicon.svg" color="#e94560" />
  {% block styles %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>

<body hx-boost="true" hx-target="#app-shell" hx-swap="outerHTML" hx-indicator="#boost-indicator">
  <div id="boost-indicator" class="boost-indicator" aria-hidden="true"></div>
  <script>
    // Delegated delete-confirm: forms with data-confirm="…" ask before
    // submitting. Kept out of inline onclick so dynamic values can't be
    // interpolated into JS.
    document.addEventListener('submit', (e) => {
      const msg = e.target instanceof HTMLFormElement ? e.target.dataset.confirm : null;
      if (msg && !window.confirm(msg)) {
        e.preventDefault();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      // Only suppress Enter on multi-row logging forms (marked with
      // data-suppress-enter); every other form (login, name fields, …)
      // must keep Enter-to-submit working.
      document.querySelectorAll('form[data-suppress-enter]').forEach(form => {
        form.addEventListener('keydown', e => {
          if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
            e.preventDefault();
          }
        });
      });
    });
  </script>

  <!-- Mobile top bar -->
  <header class="mobile-topbar">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <a href="/" class="topbar-title">
      <img src="/static/favicon.svg" alt="" width="20" height="20" />
      trainlocks
    </a>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar (fragment: re-rendered by the server on htmx navigation so
       the active link always reflects the URL) -->
  <div id="app-shell" class="app-shell">
    {% include "partials/nav.html" %}

    <main class="main" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      const r = document.documentElement;
      // Explicit choice wins; otherwise follow the OS preference.
      const saved = localStorage.getItem("theme");
      const d = saved === "dark" || saved === "light"
        ? saved
        : (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
      r.setAttribute("data-theme", d);
      // Keep mobile browser chrome in step with the active theme
      const meta = document.querySelector('meta[name="theme-color"]');

      function paint() {
        const btn = document.getElementById("theme-toggle");
        if (!btn) return;
        const cur = r.getAttribute("data-theme");
        btn.setAttribute("aria-label", cur === "dark" ? "Switch to light theme" : "Switch to dark theme");
        const moon = btn.querySelector(".icon-moon");
        const sun = btn.querySelector(".icon-sun");
        if (moon) moon.style.display = cur === "dark" ? "" : "none";
        if (sun) sun.style.display = cur === "dark" ? "none" : "";
      }

      // ── Theme toggle: delegated on <body> so it survives htmx swaps ──
      // Guard: htmx re-executes body scripts on boosted swaps, and this
      // listener must be attached exactly once or each click flips the
      // theme N times (N = swaps since load), leaving it unchanged.
      if (!window.__trainlocksThemeWired) {
        window.__trainlocksThemeWired = true;
        document.body.addEventListener("click", (e) => {
          const btn = e.target.closest("#theme-toggle");
          if (!btn) return;
          const next = r.getAttribute("data-theme") === "dark" ? "light" : "dark";
          r.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          if (meta) meta.setAttribute("content", next === "dark" ? "#0b0d12" : "#f5f6f8");
          paint();
        });
      }

      // Repaint icon state whenever a fresh sidebar lands (exposed for the
      // htmx afterSettle hook; don't dispatch DOMContentLoaded — it would
      // re-run every DOMContentLoaded listener in the app).
      window.__trainlocksRepaintTheme = paint;
      paint();
    })();

    // ── Mobile sidebar toggle ────────────────────────────────────────────
    (function () {
      const toggle = document.getElementById('menu-toggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      function openMenu() {
        sidebar.classList.add('open');
        overlay.classList.add('visible');
        toggle.setAttribute('aria-expanded', 'true');
      }
      function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('visible');
        toggle.setAttribute('aria-expanded', 'false');
      }
      function toggleMenu() {
        sidebar.classList.contains('open') ? closeMenu() : openMenu();
      }

      if (toggle && sidebar && overlay) {
        toggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', closeMenu);
        // Close menu when a nav link is tapped
        sidebar.querySelectorAll('.nav-link').forEach(link => {
          link.addEventListener('click', closeMenu);
        });
      }
    })();
  </script>
  {% block scripts %}{% endblock %}

  <script>
    // ── htmx prototype wiring ──────────────────────────────────────
    // Morph swaps with the View Transitions API where the browser
    // supports it; graceful instant swap everywhere else.
    htmx.config.globalViewTransitions = true;

    // Re-run per-page scripts after any boosted swap: the fragment that
    // replaces #app-shell carries <script> tags (chart init etc.) which
    // htmx does not execute. Cloning forces re-execution.
    document.addEventListener('htmx:afterSettle', (e) => {
      if (!e.detail || !e.detail.elt || e.detail.elt !== document.body) return;
      document.querySelectorAll('#app-shell script[src]').forEach((old) => {
        const s = document.createElement('script');
        s.src = old.src;
        old.replaceWith(s);
      });
      document.querySelectorAll('#app-shell script:not([src])').forEach((old) => {
        const s = document.createElement('script');
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
      // Repaint theme icon state for the freshly swapped sidebar
      if (window.__trainlocksRepaintTheme) window.__trainlocksRepaintTheme();
    });

    // ── KPI spotlight: track the pointer over any kpi card ─────────
    // Delegated so it works for cards swapped in by htmx too.
    document.addEventListener('pointermove', (e) => {
      const card = e.target.closest && e.target.closest('a.kpi-card');
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }, { passive: true });
  </script>
</body>

</html>
