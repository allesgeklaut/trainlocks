<div class="card" id="weekly-load-card">
  <div class="section-header">
    <span class="section-title">Weekly Load <span class="section-title-suffix">· last {{ chart_weeks }} weeks</span></span>
    <div class="range-switch" role="group" aria-label="Chart range">
      {% for w in [4, 12, 26] %}
      <button type="button"
              class="{% if w == chart_weeks %}active{% endif %}"
              hx-get="/fragments/weekly-load?weeks={{ w }}"
              hx-target="#weekly-load-card"
              hx-swap="outerHTML"
              hx-push-url="false">
        {{ w }}w
      </button>
      {% endfor %}
    </div>
  </div>

  {% if weekly_activity %}
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <div class="chart-box chart-swap-enter">
    <canvas id="activityChart"></canvas>
  </div>
  {% else %}
  <p class="text-muted" style="text-align:center;padding:var(--space-6)">No training data yet. Log your first session to see activity!</p>
  {% endif %}
</div>

{% if weekly_activity %}
<script>
(function() {
  const activityData = {{ weekly_activity | tojson }};
  if (activityData.length === 0) return;

  const style = getComputedStyle(document.documentElement);
  const colorMuted    = style.getPropertyValue("--color-text-muted").trim();
  const colorPrimary  = style.getPropertyValue("--color-primary").trim();
  const colorBlue     = style.getPropertyValue("--color-blue").trim();
  const colorDivider  = style.getPropertyValue("--color-divider").trim();
  const colorSurface  = style.getPropertyValue("--color-surface").trim();
  const colorText     = style.getPropertyValue("--color-text").trim();
  const fontBody      = style.getPropertyValue("--font-body").trim();

  const ctx = document.getElementById("activityChart").getContext("2d");
  const isCompact = window.matchMedia("(max-width: 768px)").matches;
  const shortLabel = l => l.replace(/^\d{4}-W/, "W");

  // Soft vertical gradient under the strength curve (tracks the canvas height
  // so the fade reaches fully transparent at the bottom edge, whatever the
  // responsive .chart-box height is)
  const strengthFill = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  strengthFill.addColorStop(0, colorPrimary + "3d");
  strengthFill.addColorStop(1, colorPrimary + "00");

  const tooltip = {
    backgroundColor: colorSurface,
    borderColor: colorDivider,
    borderWidth: 1,
    titleColor: colorText,
    bodyColor: colorMuted,
    titleFont: { family: fontBody, weight: "600", size: 12 },
    bodyFont: { family: fontBody, size: 12 },
    padding: 10,
    cornerRadius: 10,
    boxPadding: 4,
    displayColors: true,
  };

  new Chart(ctx, {
    type: "line",
    data: {
      labels: activityData.map(d => isCompact ? shortLabel(d.date) : d.date.replace(/^\d{4}-W/, "W")),
      datasets: [{
        label: "Strength",
        data: activityData.map(d => d.load),
        yAxisID: "y",
        borderColor: colorPrimary,
        backgroundColor: strengthFill,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointBackgroundColor: colorPrimary,
        pointBorderColor: colorSurface,
        pointBorderWidth: 2,
        fill: true,
        tension: 0.4,
      }, {
        label: "Cardio",
        data: activityData.map(d => d.cardio_load),
        yAxisID: "y1",
        borderColor: colorBlue,
        backgroundColor: "transparent",
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointBackgroundColor: colorBlue,
        pointBorderColor: colorSurface,
        pointBorderWidth: 2,
        fill: false,
        tension: 0.4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      animation: { duration: 700, easing: "easeOutQuart" },
      plugins: {
        legend: {
          display: true,
          position: "top",
          align: "end",
          labels: {
            color: colorMuted,
            usePointStyle: true,
            pointStyle: "circle",
            boxWidth: 6,
            boxHeight: 6,
            font: { family: fontBody, size: isCompact ? 10 : 12 },
            padding: isCompact ? 8 : 16,
          }
        },
        tooltip: tooltip,
      },
      scales: {
        x: {
          ticks: {
            color: colorMuted,
            font: { size: isCompact ? 9 : 11 },
            maxRotation: isCompact ? 45 : 0,
            minRotation: isCompact ? 45 : 0,
            autoSkip: true,
            maxTicksLimit: isCompact ? 6 : Math.min(activityData.length, 12),
          },
          grid: { display: false },
          border: { display: false },
        },
        y: {
          title: { display: !isCompact, text: "Strength (kg)", color: colorMuted, font: { size: 11 } },
          ticks: {
            color: colorMuted,
            font: { size: isCompact ? 9 : 11 },
            maxTicksLimit: isCompact ? 5 : 6,
            callback: v => Intl.NumberFormat("en", { notation: "compact" }).format(v),
          },
          grid: { color: colorDivider },
          border: { display: false },
          beginAtZero: true,
        },
        y1: {
          position: "right",
          title: { display: !isCompact, text: "Cardio Load", color: colorMuted, font: { size: 11 } },
          ticks: {
            color: colorMuted,
            font: { size: isCompact ? 9 : 11 },
            maxTicksLimit: isCompact ? 5 : 6,
          },
          grid: { drawOnChartArea: false },
          border: { display: false },
          beginAtZero: true,
        },
      },
    },
  });
})();
</script>
{% endif %}
