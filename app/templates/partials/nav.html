<nav class="sidebar" id="sidebar" aria-label="Main navigation">
  {% set path = request.url.path %}
  <a href="/" class="nav-link {% if path == '/' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" />
      <rect x="14" y="3" width="7" height="7" />
      <rect x="14" y="14" width="7" height="7" />
      <rect x="3" y="14" width="7" height="7" />
    </svg>
    Dashboard
  </a>
  <a href="/exercises" class="nav-link {% if path.startswith('/exercises') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
    </svg>
    Exercises
  </a>
  <a href="/templates" class="nav-link {% if path.startswith('/templates') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
      <rect x="9" y="3" width="6" height="4" rx="1" />
      <path d="M9 12h6M9 16h4" />
    </svg>
    Templates
  </a>
  <a href="/sessions/new" class="nav-link {% if path == '/sessions/new' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v8M8 12h8" />
    </svg>
    Log Session
  </a>
  <a href="/sessions" class="nav-link {% if path.startswith('/sessions') and path != '/sessions/new' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    Sessions
  </a>
  <a href="/cardio" class="nav-link {% if path.startswith('/cardio') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M13 4l3 3-8 8-3 5 5-3 8-8 3 3" />
      <path d="M5 20l2-2" />
    </svg>
    Cardio
  </a>
  <a href="/progression" class="nav-link {% if path.startswith('/progression') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
    </svg>
    Progression
  </a>

  <div class="nav-section-label">Discover</div>
  <a href="/browse/exercises" class="nav-link {% if path.startswith('/browse/exercises') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    Browse Exercises
  </a>
  <a href="/browse/plans" class="nav-link {% if path.startswith('/browse/plans') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
    </svg>
    Training Plans
  </a>

  {% if user %}
  <div class="nav-section-label" style="margin-top: var(--space-4);">Account</div>
  <a href="/profile" class="nav-link {% if path.startswith('/profile') %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    Profile
  </a>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <span>Theme</span>
  </button>
  <div class="sidebar-user">
    <span class="sidebar-username">{{ user.username }}</span>
    <form method="post" action="/logout" style="display:inline">
      <button type="submit" class="sidebar-logout">Sign out</button>
    </form>
  </div>
  {% endif %}
</nav>
